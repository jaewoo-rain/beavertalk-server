<!doctype html>
<meta charset="utf-8">
<title>할인 이벤트 관리</title>
<!--
  할인 이벤트 관리 콘솔 (dev 도구 — ENV != "prod" 에서만 서빙).
  같은 오리진이라 CORS 불필요. 인증은 Supabase access token(Bearer).
  운영자는 "-50%" 로 생각하지 "5.00" 으로 생각하지 않으므로, 할인율 입력 → 가격 자동 계산을 준다.
-->
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.6 system-ui, sans-serif; margin: 24px; max-width: 1080px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { opacity: .7; margin-bottom: 20px; }
  fieldset { border: 1px solid #8884; border-radius: 8px; padding: 14px 16px; margin: 0 0 18px; }
  legend { padding: 0 6px; font-weight: 600; }
  label { display: inline-block; margin: 4px 14px 4px 0; }
  input, select, button { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid #8886; background: transparent; color: inherit; }
  button { cursor: pointer; }
  button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  button.danger { border-color: #dc2626; color: #dc2626; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid #8883; padding: 7px 8px; text-align: left; white-space: nowrap; }
  th { font-weight: 600; opacity: .8; }
  .live { color: #16a34a; font-weight: 700; }
  .off  { opacity: .45; }
  .muted { opacity: .6; }
  .row { margin: 6px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row > b { min-width: 42px; }
  .hidden { display: none; }
  #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; opacity: .8; margin-top: 12px; }
</style>

<h1>할인 이벤트 관리</h1>
<div class="sub">
  활성 조건 = <code>activate</code> ✓ &nbsp;그리고&nbsp; <code>start_time ≤ 지금 ≤ end_time</code>.
  조건을 만족하는 이벤트가 있어야 앱에 <b>-N% 배지</b>와 <b>한정 할인 카운트다운</b>이 뜬다.
</div>

<fieldset>
  <legend>1. 로그인</legend>
  <label>API <input id="apibase" size="42"></label>
  <label>이메일 <input id="email" size="26" placeholder="you@example.com"></label>
  <label>비밀번호 <input id="pw" type="password" size="16"></label>
  <button class="primary" onclick="login()">로그인</button>
  <button onclick="logout()">로그아웃</button>
  <span id="who" class="muted">로그인 필요</span>
  <details style="margin-top:8px">
    <summary class="muted">토큰 직접 넣기</summary>
    <label style="margin-top:6px">토큰 <input id="token" size="58" placeholder="Supabase access token"></label>
    <button onclick="load()">이 토큰으로 불러오기</button>
  </details>
</fieldset>

<fieldset>
  <legend>2. 할인 걸기</legend>

  <div><label>캐릭터 <select id="cid"></select></label></div>

  <div class="row">
    <b>가격</b>
    <label><input type="radio" name="pmode" value="rate" checked> 할인율(%)</label>
    <label><input type="radio" name="pmode" value="amount"> 금액 직접</label>
  </div>
  <div class="row" id="pmode-rate">
    <label>할인율 <input id="rate" type="number" min="1" max="100" step="1" value="50" size="4">%</label>
    <span class="muted">→ 할인가 <b id="calcPrice">—</b></span>
  </div>
  <div class="row hidden" id="pmode-amount">
    <label>할인가 $<input id="amount" type="number" min="0" step="0.01" value="5.00" size="6"></label>
    <span class="muted">→ 할인율 <b id="calcRate">—</b></span>
  </div>

  <div class="row">
    <b>기간</b>
    <label><input type="radio" name="tmode" value="from-now" checked> 지금부터 N시간</label>
    <label><input type="radio" name="tmode" value="explicit"> 시작·종료 직접 지정</label>
  </div>
  <div class="row" id="tmode-from-now">
    <label>지금부터 <input id="hours" type="number" min="1" step="1" value="24" size="5">시간</label>
    <span class="muted">
      빠른 선택:
      <button type="button" onclick="setHours(1)">1시간</button>
      <button type="button" onclick="setHours(6)">6시간</button>
      <button type="button" onclick="setHours(24)">24시간</button>
      <button type="button" onclick="setHours(72)">3일</button>
      <button type="button" onclick="setHours(168)">7일</button>
    </span>
  </div>
  <div class="row hidden" id="tmode-explicit">
    <label>시작 <input id="startAt" type="datetime-local"></label>
    <label>종료 <input id="endAt" type="datetime-local"></label>
  </div>

  <div class="row">
    <button class="primary" onclick="create()">생성</button>
    <span class="muted" id="preview"></span>
  </div>
</fieldset>

<fieldset>
  <legend>3. 현재 이벤트</legend>
  <table id="tbl"><thead><tr>
    <th>id</th><th>캐릭터</th><th>정가</th><th>할인가</th><th>할인율</th>
    <th>시작</th><th>종료</th><th>상태</th><th>남은 시간</th><th></th>
  </tr></thead><tbody></tbody></table>
</fieldset>

<div id="log"></div>

<script>
const $ = s => document.querySelector(s);
const apiBase = () => $('#apibase').value.replace(/\/+$/, '');
let CHARS = [], EVENTS = [], SKEW = 0;   // SKEW: 서버-브라우저 시계 차(ms)

$('#apibase').value = location.origin;
$('#token').value = localStorage.getItem('bt_token') || '';
$('#email').value = localStorage.getItem('bt_email') || '';

function log(m) { $('#log').textContent = m; }

/** Date → datetime-local 입력값(로컬 시각, 초 없음). toISOString 은 UTC 라 못 쓴다. */
function toLocalInput(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function setWho(text, ok) {
  $('#who').textContent = text;
  $('#who').className = ok ? 'live' : 'muted';
}

// 로그인은 서버가 대행한다(POST /__dev/login) — 브라우저에서 직접 Supabase 를 부르려면
// anon 키가 필요한데 배포 환경엔 없다. 서버는 자기가 토큰을 검증하는 그 프로젝트로
// 로그인하므로, 환경(dev/prod Supabase)이 달라도 어긋나지 않는다.
async function login() {
  const email = $('#email').value.trim(), password = $('#pw').value;
  if (!email || !password) { setWho('이메일·비밀번호를 입력해라', false); return; }
  setWho('로그인 중…', false);
  try {
    const r = await fetch(apiBase() + '/__dev/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    if (!r.ok) { setWho('❌ 로그인 실패 (' + r.status + ')', false); return; }
    const d = await r.json();
    $('#token').value = d.access_token;
    localStorage.setItem('bt_token', d.access_token);
    localStorage.setItem('bt_email', email);
    setWho('✅ ' + d.email, true);
    await load();
  } catch (e) { setWho('❌ ' + e.message, false); }
}

function logout() {
  $('#token').value = '';
  $('#pw').value = '';
  localStorage.removeItem('bt_token');
  setWho('로그아웃됨', false);
  $('#tbl tbody').innerHTML = '';
}

async function api(path, opts = {}) {
  opts.headers = Object.assign(
    { Authorization: `Bearer ${$('#token').value.trim()}` }, opts.headers || {});
  const r = await fetch(apiBase() + path, opts);
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.status === 204 ? null : r.json();
}

function priceOf(cid) {
  const c = CHARS.find(c => c.character_id == cid);
  return c ? parseFloat(c.price) : 0;
}
function nameOf(cid) {
  const c = CHARS.find(c => c.character_id == cid);
  return c ? c.name : `#${cid}`;
}

const pmode = () => document.querySelector('input[name=pmode]:checked').value;
const tmode = () => document.querySelector('input[name=tmode]:checked').value;

/** 최종 할인가(달러, 소수 2자리 문자열). 두 입력 방식 중 선택된 쪽에서 뽑는다. */
function finalPrice() {
  const base = priceOf($('#cid').value);
  if (pmode() === 'rate') {
    const rate = Math.min(100, Math.max(0, +$('#rate').value || 0));
    return Math.max(0, base * (1 - rate / 100));
  }
  return Math.max(0, +$('#amount').value || 0);
}

/** 시작·종료(Date). "지금부터 N시간"은 서버 시각(SKEW 보정) 기준으로 만든다. */
function window_() {
  if (tmode() === 'from-now') {
    const h = Math.max(0, +$('#hours').value || 0);
    const s = new Date(Date.now() + SKEW);
    return [s, new Date(s.getTime() + h * 3600e3)];
  }
  const s = $('#startAt').value ? new Date($('#startAt').value) : null;
  const e = $('#endAt').value ? new Date($('#endAt').value) : null;
  return [s, e];   // datetime-local 은 로컬 시각 → toISOString() 이 UTC 로 변환해 준다
}

function setHours(h) { $('#hours').value = h; recalc(); }

function recalc() {
  // 선택된 입력 방식만 보이게
  $('#pmode-rate').classList.toggle('hidden', pmode() !== 'rate');
  $('#pmode-amount').classList.toggle('hidden', pmode() !== 'amount');
  $('#tmode-from-now').classList.toggle('hidden', tmode() !== 'from-now');
  $('#tmode-explicit').classList.toggle('hidden', tmode() !== 'explicit');

  const base = priceOf($('#cid').value);
  const p = finalPrice();
  // 반대쪽 값을 실시간으로 보여준다(%로 넣으면 금액을, 금액으로 넣으면 %를).
  $('#calcPrice').textContent = '$' + p.toFixed(2);
  $('#calcRate').textContent =
    base > 0 ? '-' + Math.round((1 - p / base) * 100) + '%' : '—';

  const [s, e] = window_();
  let msg;
  if (base <= 0) msg = '⚠ 정가가 0인 무료 캐릭터라 할인이 의미 없다.';
  else if (!s || !e) msg = '⚠ 시작·종료 시각을 채워라.';
  else if (e <= s) msg = '⚠ 종료가 시작보다 빠르다.';
  else if (p >= base) msg = '⚠ 할인가가 정가 이상이라 앱에 할인으로 안 보인다.';
  else msg = `$${base.toFixed(2)} → $${p.toFixed(2)} · ${s.toLocaleString()} ~ ${e.toLocaleString()}`;
  $('#preview').textContent = msg;
}
document.addEventListener('input', recalc);
document.addEventListener('change', recalc);

async function load() {
  const tk = $('#token').value.trim();
  if (!tk) { setWho('로그인 필요', false); return; }
  localStorage.setItem('bt_token', tk);
  try {
    const d = await api('/__dev/discounts');
    CHARS = d.characters; EVENTS = d.events;
    SKEW = new Date(d.now).getTime() - Date.now();   // 브라우저 시계가 틀려도 판정이 맞게
    $('#cid').innerHTML = CHARS.map(c =>
      `<option value="${c.character_id}">${c.name} ($${(+c.price).toFixed(2)})</option>`).join('');
    // 직접 지정 칸 기본값 = 지금 ~ 24시간 뒤(서버 시각 기준). 빈 칸이면 뭘 넣을지 헷갈린다.
    if (!$('#startAt').value) {
      const s = new Date(Date.now() + SKEW), e = new Date(s.getTime() + 24 * 3600e3);
      $('#startAt').value = toLocalInput(s);
      $('#endAt').value = toLocalInput(e);
    }
    recalc(); render();
    log(`캐릭터 ${CHARS.length} · 이벤트 ${EVENTS.length} · 서버시각 ${d.now}`);
  } catch (e) { log('실패: ' + e.message); }
}

function render() {
  const now = Date.now() + SKEW;
  $('#tbl tbody').innerHTML = EVENTS.map(e => {
    const s = e.start_time ? new Date(e.start_time).getTime() : null;
    const en = e.end_time ? new Date(e.end_time).getTime() : null;
    const inWindow = s !== null && en !== null && s <= now && now <= en;
    const live = e.activate && e.discount_price !== null && inWindow;
    const base = priceOf(e.character_id), dp = e.discount_price ? +e.discount_price : null;
    const rate = base > 0 && dp !== null ? Math.round((1 - dp / base) * 100) : null;
    let state = '비활성', cls = 'off';
    if (live) { state = '적용 중'; cls = 'live'; }
    else if (!e.activate) state = 'activate=false';
    else if (en !== null && now > en) state = '종료됨';
    else if (s !== null && now < s) state = '예정';
    const left = live ? fmtLeft(en - now) : '—';
    return `<tr class="${cls}">
      <td>${e.discount_event_id}</td><td>${nameOf(e.character_id)}</td>
      <td>$${base.toFixed(2)}</td><td>${dp === null ? '—' : '$' + dp.toFixed(2)}</td>
      <td>${rate === null ? '—' : '-' + rate + '%'}</td>
      <td>${e.start_time ? new Date(e.start_time).toLocaleString() : '—'}</td>
      <td>${e.end_time ? new Date(e.end_time).toLocaleString() : '—'}</td>
      <td>${state}</td><td>${left}</td>
      <td>
        <button onclick="toggle(${e.discount_event_id}, ${!e.activate})">${e.activate ? '끄기' : '켜기'}</button>
        <button class="danger" onclick="del(${e.discount_event_id})">삭제</button>
      </td></tr>`;
  }).join('');
}

function fmtLeft(ms) {
  if (ms < 0) return '—';
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600);
  const m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (d ? `${d}일 ` : '') + `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

async function create() {
  const base = priceOf($('#cid').value);
  const p = finalPrice();
  const [s, e] = window_();
  if (!s || !e) { log('시작·종료 시각을 채워라.'); return; }
  if (e <= s) { log('종료가 시작보다 빨라 생성하지 않았다.'); return; }
  if (base > 0 && p >= base &&
      !confirm('할인가가 정가 이상이라 앱에 할인으로 안 보인다. 그래도 생성?')) return;
  const body = {
    character_id: +$('#cid').value,
    discount_price: p.toFixed(2),
    start_time: s.toISOString(),
    end_time: e.toISOString(),
    activate: true,
  };
  try {
    const r = await api('/__dev/discounts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    log(`생성됨 id=${r.discount_event_id}`);
    await load();
  } catch (e) { log('생성 실패: ' + e.message); }
}

async function toggle(id, activate) {
  try {
    await api(`/__dev/discounts/${id}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ activate }),
    });
    await load();
  } catch (e) { log('토글 실패: ' + e.message); }
}

async function del(id) {
  if (!confirm(`이벤트 ${id} 삭제?`)) return;
  try { await api(`/__dev/discounts/${id}`, { method: 'DELETE' }); await load(); }
  catch (e) { log('삭제 실패: ' + e.message); }
}

setInterval(() => { if (EVENTS.length) render(); }, 1000);   // 남은 시간 초 단위 갱신
</script>
